            },
        ];
        
        let displayedComics = [];
        let currentFilter = 'general';
        let currentPage = 0;
        const comicsPerPage = 6;
        
        function createComicCard(comic) {
            return `
                <div class="comic-card">
                    <img src="${comic.image}" alt="${comic.title}" class="comic-image" onerror="this.src='https://via.placeholder.com/100x130?text=No+Image'">
                    <div class="comic-info">
                        <div class="comic-title-author">

                            <span class="title-separator">|</span>
                            <span class="comic-author">${comic.author}</span>
                        </div>
                        <div class="comic-stats">
                            <div class="stat-item">
                                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7,10 12,15 17,10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                                <span>${comic.downloads.toLocaleString()}</span>
                            </div>
                            <div class="stat-item">
                                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <span>${comic.views.toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="comic-actions">
                            <button class="like-btn" data-comic-id="${comic.id}">
                                <svg class="like-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                </svg>
                            </button>
                            <a href="${comic.downloadLink}" class="download-btn" download>
                                <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7,10 12,15 17,10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                                Download
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function loadComics(append = false) {
            const filteredComics = comicsData.filter(comic => 
                currentFilter === 'general' || comic.category === currentFilter
            );
            const startIndex = currentPage * comicsPerPage;
            const endIndex = startIndex + comicsPerPage;
            const comicsToShow = filteredComics.slice(startIndex, endIndex);
            
            if (comicsToShow.length === 0) {
                document.getElementById('loading').style.display = 'none';
                return;
            }
            
            const comicsGrid = document.getElementById('comicsGrid');
            const comicsHTML = comicsToShow.map(createComicCard).join('');
            
            if (append) {
                comicsGrid.innerHTML += comicsHTML;
            } else {
                comicsGrid.innerHTML = comicsHTML;
                displayedComics = [];
            }
            
            displayedComics.push(...comicsToShow);
            currentPage++;
            
            document.getElementById('loading').style.display = 'none';
        }
        
        // Event delegation for like buttons
        document.addEventListener('click', function(e) {
            if (e.target.closest('.like-btn')) {
                const button = e.target.closest('.like-btn');
                button.classList.toggle('liked');
            }
        });
        
        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Remove active class from all buttons
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                
                // Add active class to clicked button
                btn.classList.add('active');
                
                // Update current filter
                currentFilter = btn.dataset.filter;
                currentPage = 0;
                
                // Load comics for new filter
                loadComics(false);
            });
        });
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredComics = comicsData.filter(comic => {
                const inCategory = currentFilter === 'general' || comic.category === currentFilter;
                const matchesSearch = comic.title.toLowerCase().includes(searchTerm) || 
                                      comic.author.toLowerCase().includes(searchTerm);
                return inCategory && matchesSearch;
            });
            
            const comicsGrid = document.getElementById('comicsGrid');
            comicsGrid.innerHTML = filteredComics.map(createComicCard).join('');
        });
        
        // Infinite scroll
        let isLoading = false;
        
        window.addEventListener('scroll', () => {
            if (isLoading) return;
            
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            
            if (scrollTop + windowHeight >= documentHeight - 100) {
                isLoading = true;
                document.getElementById('loading').style.display = 'block';
                setTimeout(() => {
                    loadComics(true);
                    isLoading = false;
                }, 1000);
            }
        });
        
        // Initial load
        document.addEventListener('DOMContentLoaded', function() {
            loadComics();
        });
        
        // If DOMContentLoaded already fired
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadComics);
        } else {
            loadComics();
        }
    </script>
</body>
</html>
